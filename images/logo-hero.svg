<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="朝活ブログ部">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2f57"/>
      <stop offset="45%" stop-color="#1f4e82"/>
      <stop offset="78%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#3d82c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb457" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#ed8936" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ed8936" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="55%" stop-color="#f6a43c"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a68"/>
      <stop offset="100%" stop-color="#0d2c50"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2444"/>
      <stop offset="100%" stop-color="#081a33"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- 朝の光 -->
    <circle cx="1180" cy="600" r="520" fill="url(#glow)"/>
    <g opacity=".16" fill="#ffd08a">
      <rect x="0" y="470" width="1600" height="3"/>
      <rect x="0" y="512" width="1600" height="2"/>
      <rect x="0" y="548" width="1600" height="2"/>
    </g>

    <!-- 昇る太陽 -->
    <circle cx="1180" cy="600" r="132" fill="url(#sun)"/>
    <circle cx="1180" cy="600" r="132" fill="none" stroke="#ffe3b5" stroke-opacity=".55" stroke-width="3"/>

    <!-- 稜線 -->
    <path d="M0 640 C 260 566, 470 690, 760 636 C 1030 586, 1290 690, 1600 616 L1600 900 L0 900 Z" fill="url(#hillA)"/>
    <path d="M0 748 C 300 690, 560 800, 900 742 C 1200 690, 1400 792, 1600 738 L1600 900 L0 900 Z" fill="url(#hillB)"/>

    <!-- ロゴタイプ -->
    <g font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
      <text x="118" y="404" fill="#ffffff" font-size="164" font-weight="800" letter-spacing="6">朝活ブログ部</text>
      <rect x="122" y="452" width="132" height="9" rx="4.5" fill="#ed8936"/>
      <text x="124" y="536" fill="#cfe2f7" font-size="41" font-weight="600" letter-spacing="10">交流勉強会の記録</text>
      <text x="126" y="606" fill="#8fb6df" font-size="27" font-weight="600" letter-spacing="16">MORNING BLOG CLUB</text>
    </g>
  </g>
</svg>
